[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeflow"
version = "1.0.0"
description = "Turn real FPV flight movements into synchronized music."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "VibeFlow"}]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "PySide6>=6.7",
    "py7zr>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vibeflow = "vibeflow.app:main"

[tool.setuptools.packages.find]
include = ["vibeflow*"]

[tool.setuptools.package-data]
"vibeflow.ui" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
